<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1769df">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FoodFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="FoodFlow — план питания на 30 дней: расписание, закупки, остатки, контейнеры и бюджет. Работает офлайн.">

  <meta property="og:description" content="Персональный план питания на 30 дней: расписание, закупки, остатки и бюджет. Работает офлайн.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:image" content="https://foodflow-app-eta.vercel.app/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://foodflow-app-eta.vercel.app/icons/icon-512.png">
  <meta name="twitter:title" content="FoodFlow · План питания">
  <meta name="twitter:description" content="Персональный план питания на 30 дней: расписание, закупки, остатки и бюджет.">
  <title>FoodFlow · План питания</title>
  <link rel="canonical" href="https://foodflow-app-eta.vercel.app/">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="foodflow-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="sitemap" type="application/xml" href="sitemap.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <script src="data-bundle.js" defer></script>
  <script src="data-loader.js" defer></script>
  <style>
    :root{
      --color-midnight-graphite:#1e242c;
      --color-ocean-blue:#1a73e8;
      --color-pewter-slate:#576579;
      --color-pure-white:#ffffff;
      --color-light-fog:#e7eaee;
      --color-silver-dust:#cfd5dd;
      --color-ash-grey:#dbdfe5;

      --surface-page-canvas:#ffffff;
      --surface-card-surface:#ffffff;

      --font-text:Arial, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --text-body-lg:16px;
      --leading-body-lg:1.5;
      --text-heading:26px;
      --leading-heading:1.2;
      --text-display:57px;
      --leading-display:1.12;

      --spacing-8:8px;
      --spacing-16:16px;
      --spacing-24:24px;
      --spacing-32:32px;
      --spacing-48:48px;
      --spacing-64:64px;
      --radius-cards:8px;
      --radius-buttons:8px;

      --shadow-card:
        rgba(55,73,81,.12) 0 36px 80px 0,
        rgba(55,73,81,.07) 0 16px 36px 0,
        rgba(55,73,81,.05) 0 6px 14px 0;
    }

    *{box-sizing:border-box}
    html{background:var(--surface-page-canvas)}
    body{
      margin:0;
      background:
        radial-gradient(circle at 12% 0%, rgba(26,115,232,.06), transparent 28%),
        linear-gradient(180deg,#fff 0%,#fbfcfe 100%);
      color:var(--color-midnight-graphite);
      font-family:var(--font-text);
      font-size:var(--text-body-lg);
      line-height:var(--leading-body-lg);
      letter-spacing:-.01em;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    button,select,input{
      font:inherit;
      letter-spacing:inherit;
      border:1px solid var(--color-light-fog);
      background:var(--color-pure-white);
      color:var(--color-midnight-graphite);
      border-radius:var(--radius-buttons);
      padding:10px 14px;
      cursor:pointer;
      transition:background .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease,transform .16s ease;
    }
    button:hover,select:hover,input:hover{
      border-color:var(--color-silver-dust);
      box-shadow:rgba(0,0,0,.08) 0 0 2px 0;
    }
    button:active{transform:translateY(1px)}
    button:focus-visible,select:focus-visible,input:focus-visible{
      outline:2px solid rgba(26,115,232,.24);
      outline-offset:2px;
      border-color:var(--color-ocean-blue);
    }
    .skipLink{
      position:fixed;
      left:12px;
      top:12px;
      z-index:300;
      transform:translateY(-140%);
      background:#fff;
      color:var(--color-midnight-graphite);
      border:2px solid var(--color-ocean-blue);
      border-radius:10px;
      padding:10px 14px;
      font-weight:800;
      text-decoration:none;
    }
    .skipLink:focus{transform:none}

    .top{
      position:sticky;
      top:0;
      z-index:30;
      background:rgba(255,255,255,.88);
      backdrop-filter:blur(18px);
      border-bottom:1px solid var(--color-light-fog);
    }
    .topInner{
      max-width:1180px;
      margin:0 auto;
      display:grid;
      grid-template-columns:1fr auto;
      gap:var(--spacing-16);
      align-items:center;
      padding:14px var(--spacing-24);
    }
    .brand,.label{
      display:inline-flex;
      gap:var(--spacing-8);
      align-items:center;
      white-space:nowrap;
    }
    .brand{
      font-size:14px;
      line-height:1.45;
      color:var(--color-midnight-graphite);
      letter-spacing:-.02em;
    }
    .label{flex-wrap:wrap}
    .label .small{color:var(--color-pewter-slate)}

    .shell{
      max-width:1180px;
      margin:0 auto;
      padding:0 var(--spacing-24) var(--spacing-64);
    }

    .hero{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(320px,.72fr);
      gap:var(--spacing-32);
      padding:var(--spacing-48) 0 var(--spacing-32);
    }
    .hero > div:first-child{
      background:var(--color-midnight-graphite);
      color:var(--color-pure-white);
      border-radius:16px;
      padding:var(--spacing-32);
      min-height:220px;
      display:flex;
      align-items:flex-end;
      box-shadow:var(--shadow-card);
    }
    .num{
      font-size:clamp(72px,14vw,180px);
      line-height:.88;
      margin:0;
      font-weight:400;
      letter-spacing:-.06em;
    }
    .caption,.small{
      font-size:13px;
      color:var(--color-pewter-slate);
      letter-spacing:0;
      line-height:1.45;
    }
    .side{
      display:grid;
      gap:var(--spacing-16);
      align-content:start;
    }
    .side > div,
    .line{
      background:var(--surface-card-surface);
      border:1px solid var(--color-ash-grey);
      border-radius:var(--radius-cards);
      padding:var(--spacing-24);
      box-shadow:rgba(55,73,81,.08) 0 12px 32px 0, rgba(55,73,81,.05) 0 4px 10px 0;
    }
    .line{border-top:1px solid var(--color-ash-grey)}
    .line p{margin:0}
    #dayTitle{
      font-size:var(--text-heading);
      line-height:var(--leading-heading);
      letter-spacing:-.03em;
      margin-bottom:4px;
    }
    #kcal{
      font-size:20px;
      line-height:1.25;
      color:var(--color-midnight-graphite);
      display:flex;
      gap:8px;
      align-items:center;
    }
    #markDayDone,#markDone{
      background:var(--color-ocean-blue);
      color:var(--color-pure-white);
      border-color:var(--color-ocean-blue);
      padding:12px 24px;
      border-radius:var(--radius-buttons);
    }
    #markDayDone:hover,#markDone:hover{
      background:#145fc2;
      border-color:#145fc2;
    }

    .progress{
      height:10px;
      border:1px solid var(--color-light-fog);
      background:#f4f7fb;
      border-radius:999px;
      position:relative;
      margin:10px 0;
      overflow:hidden;
    }
    .progress i{
      position:absolute;
      inset:0 auto 0 0;
      background:var(--color-ocean-blue);
      width:0%;
      border-radius:999px;
    }

    .section{padding-top:var(--spacing-24)}
    .sectionTitle{
      display:grid;
      grid-template-columns:1fr auto;
      gap:var(--spacing-16);
      align-items:end;
      margin-bottom:var(--spacing-24);
    }
    .sectionTitle h2{
      font-size:var(--text-heading);
      line-height:var(--leading-heading);
      letter-spacing:-.03em;
      font-weight:400;
      margin:0;
      display:flex;
      gap:10px;
      align-items:center;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:var(--spacing-32);
    }

    .nowCard{
      background:var(--surface-card-surface);
      border:1px solid var(--color-ash-grey);
      border-radius:16px;
      padding:var(--spacing-32);
      margin-bottom:var(--spacing-24);
      box-shadow:var(--shadow-card);
      position:relative;
      overflow:hidden;
    }
    .nowCard:before{
      content:"";
      position:absolute;
      inset:0 auto 0 0;
      width:5px;
      background:var(--color-ocean-blue);
    }
    .nowLabel{
      font-size:13px;
      color:var(--color-ocean-blue);
      letter-spacing:0;
      margin-bottom:var(--spacing-8);
    }
    .nowTime{
      font-size:var(--text-display);
      line-height:var(--leading-display);
      letter-spacing:-.05em;
      margin-bottom:var(--spacing-8);
    }
    .nowTitle{
      font-size:clamp(28px,4vw,48px);
      line-height:1.08;
      letter-spacing:-.04em;
      margin-bottom:var(--spacing-8);
      max-width:820px;
    }
    .nowMeta{
      font-size:16px;
      color:var(--color-pewter-slate);
      letter-spacing:0;
      line-height:1.5;
      max-width:760px;
    }

    .dayControls{
      display:flex;
      gap:var(--spacing-8);
      flex-wrap:wrap;
      margin:0 0 var(--spacing-24);
    }
    .toggleBtn.active,
    .tabs button.active{
      background:var(--color-midnight-graphite);
      color:var(--color-pure-white);
      border-color:var(--color-midnight-graphite);
    }
    #plus15,#plus30{
      color:var(--color-ocean-blue);
      border-color:rgba(26,115,232,.28);
    }

    .remaining{
      background:var(--surface-card-surface);
      border:1px solid var(--color-ash-grey);
      border-radius:var(--radius-cards);
      padding:var(--spacing-24);
      margin-bottom:var(--spacing-24);
      box-shadow:rgba(55,73,81,.06) 0 10px 24px 0;
    }
    .remainingRow{
      display:grid;
      grid-template-columns:90px 110px minmax(0,1fr);
      gap:var(--spacing-16);
      border-bottom:1px solid var(--color-light-fog);
      padding:10px 0;
    }
    .remainingRow:last-child{border-bottom:0;padding-bottom:0}

    .actions{
      display:grid;
      gap:var(--spacing-16);
    }
    .action{
      display:grid;
      grid-template-columns:90px 116px minmax(0,1fr) 132px;
      gap:var(--spacing-16);
      background:var(--surface-card-surface);
      border:1px solid var(--color-ash-grey);
      border-radius:var(--radius-cards);
      padding:var(--spacing-24);
      align-items:start;
      box-shadow:rgba(55,73,81,.06) 0 10px 24px 0;
      transition:opacity .16s ease, transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .action:hover{
      border-color:var(--color-silver-dust);
      box-shadow:rgba(55,73,81,.10) 0 18px 38px 0;
    }
    .nextAction{
      border-color:var(--color-ocean-blue);
      box-shadow:rgba(26,115,232,.14) 0 18px 48px 0;
    }
    .pastAction{opacity:.45}
    .hiddenByFilter{display:none!important}
    .actionTime{
      font-size:26px;
      line-height:1;
      letter-spacing:-.04em;
      color:var(--color-midnight-graphite);
    }
    .actionType{
      display:inline-flex;
      gap:8px;
      align-items:center;
      color:var(--color-pewter-slate);
      font-size:14px;
      letter-spacing:0;
      padding-top:2px;
    }
    .actionTitle{
      font-size:24px;
      line-height:1.2;
      letter-spacing:-.03em;
      color:var(--color-midnight-graphite);
    }
    .actionMeta{margin-top:6px}
    .actionBtns{
      display:grid;
      gap:var(--spacing-8);
      justify-items:start;
    }
    .actionBtns button,
    .nowCard button[data-dish],
    .nowCard button[data-cook],
    .nowCard button[data-basket]{
      background:var(--color-ocean-blue);
      color:var(--color-pure-white);
      border-color:var(--color-ocean-blue);
      border-radius:var(--radius-buttons);
    }

    .compact .actionMeta,.compact .actionBtns .small{display:none}
    .compact .action{grid-template-columns:90px 116px minmax(0,1fr) 96px;padding:18px 20px}
    .compact .actionTitle{font-size:20px}

    .row{
      display:grid;
      gap:var(--spacing-8);
      align-items:start;
      border-bottom:1px solid var(--color-light-fog);
      padding:10px 0;
    }
    .basketRow{grid-template-columns:28px minmax(0,1fr) 120px}
    .storageRow{grid-template-columns:160px 170px minmax(0,1fr)}
    .head{color:var(--color-pewter-slate);padding-bottom:12px}
    .check{
      width:18px;
      height:18px;
      margin-top:4px;
      accent-color:var(--color-ocean-blue);
    }

    .icon{
      display:inline-flex;
      width:18px;
      height:18px;
      align-items:center;
      justify-content:center;
      vertical-align:-3px;
      flex:0 0 18px;
    }
    .icon svg{
      width:18px;
      height:18px;
      stroke:currentColor;
      fill:none;
      stroke-width:1.7;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    details{
      background:var(--surface-card-surface);
      border:1px solid var(--color-ash-grey);
      border-radius:var(--radius-cards);
      padding:var(--spacing-16) var(--spacing-24);
      margin:var(--spacing-16) 0;
      box-shadow:rgba(55,73,81,.05) 0 8px 20px 0;
    }
    summary{
      cursor:pointer;
      list-style:none;
      color:var(--color-midnight-graphite);
    }
    summary::-webkit-details-marker{display:none}
    .recipeSummary{
      display:grid;
      grid-template-columns:1fr auto;
      gap:var(--spacing-16);
    }
    ul,ol{margin:10px 0 0 22px;padding:0}
    li{margin:6px 0}

    .modalBackdrop{
      position:fixed;
      inset:0;
      display:none;
      background:rgba(30,36,44,.22);
      z-index:50;
      overflow:auto;
      padding:var(--spacing-24);
      backdrop-filter:blur(10px);
    }
    .modal{
      max-width:980px;
      margin:0 auto;
      background:var(--surface-card-surface);
      border:1px solid var(--color-ash-grey);
      border-radius:16px;
      padding:var(--spacing-32);
      box-shadow:var(--shadow-card);
    }
    .modalHead{
      display:grid;
      grid-template-columns:1fr auto;
      gap:var(--spacing-16);
      align-items:start;
      margin-bottom:var(--spacing-16);
    }
    .modalTitle{
      font-size:clamp(32px,5vw,57px);
      line-height:var(--leading-display);
      letter-spacing:-.05em;
      font-weight:400;
      margin:0;
      color:var(--color-midnight-graphite);
    }
    .modalMeta{
      display:flex;
      gap:8px 16px;
      flex-wrap:wrap;
      color:var(--color-pewter-slate);
      font-size:13px;
      letter-spacing:0;
      margin-bottom:var(--spacing-24);
    }
    .recipeCols{
      display:grid;
      grid-template-columns:1fr 1.25fr;
      gap:var(--spacing-32);
      border-top:1px solid var(--color-light-fog);
      padding-top:var(--spacing-24);
    }
    .recipeCols h3{
      font-size:var(--text-heading);
      line-height:var(--leading-heading);
      letter-spacing:-.03em;
      font-weight:400;
      margin:0 0 var(--spacing-8);
    }
    .tabs{
      display:flex;
      gap:var(--spacing-8);
      margin-bottom:var(--spacing-16);
    }
    .modalList .basketRow{grid-template-columns:28px minmax(0,1fr) 120px}
    .boxGrid{
      display:grid;
      gap:10px;
      margin:10px 0 18px;
    }
    .miniBox,.boxRow,.recipeStats{
      border:1px solid var(--color-light-fog);
      border-radius:14px;
      background:#f8fafc;
      padding:12px;
    }
    .miniBox{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:10px;
      align-items:start;
    }
    .miniBox strong,.boxRow strong{
      display:block;
      color:var(--color-midnight-graphite);
    }
    .miniBox span,.boxRow span{
      display:block;
      color:var(--color-pewter-slate);
      font-size:13px;
      line-height:1.35;
      margin-top:2px;
    }
    .boxRow{
      display:grid;
      grid-template-columns:28px minmax(0,1fr) 104px;
      gap:12px;
      margin:8px 0;
    }
    .shopSection{margin:6px 0 12px}
    .shopSectionTitle{font-size:13px;font-weight:600;color:var(--color-midnight-graphite);border-bottom:1px solid var(--color-light-fog);padding-bottom:4px;margin-bottom:6px}
    .storeBadge{display:inline-block;vertical-align:middle;margin-left:6px}
    .recipeStats{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:14px;
      background:#fff;
    }
    .recipeStats span{
      display:inline-flex;
      border:1px solid var(--color-light-fog);
      border-radius:999px;
      padding:6px 10px;
      color:var(--color-pewter-slate);
      font-size:13px;
    }

    @media(max-width:980px){
      body{font-size:16px}
      .topInner,.hero,.recipeCols{grid-template-columns:1fr}
      .topInner{padding:12px 16px}
      .shell{padding:0 16px 48px}
      .hero{padding:24px 0}
      .hero > div:first-child{min-height:150px;padding:24px}
      .side{gap:12px}
      .sectionTitle{grid-template-columns:1fr}
      .action,.compact .action{
        grid-template-columns:1fr;
        padding:20px;
      }
      .actionBtns{display:flex;flex-wrap:wrap;align-items:center}
      .remainingRow,.basketRow,.storageRow{grid-template-columns:1fr}
      .boxRow,.miniBox{grid-template-columns:1fr}
      .modal{padding:24px}
      .modalHead{grid-template-columns:1fr}
    }

    :root{
      --ui-bg:#f4f6f8;
      --ui-panel:#ffffff;
      --ui-panel-soft:#f8fafc;
      --ui-border:#d9e0e8;
      --ui-ink:#17202a;
      --ui-muted:#4f6072;
      --ui-blue:#1769df;
      --ui-blue-dark:#0f4fb2;
      --ui-green:#138a58;
      --ui-warm:#fff5df;
      --ui-shadow:0 1px 3px rgba(0,0,0,.08);
      --ui-shadow-soft:0 1px 2px rgba(0,0,0,.06);
    }
    html{background:var(--ui-bg);scroll-behavior:smooth}
    body{
      background:var(--ui-bg);
      color:var(--ui-ink);
      min-height:100vh;
    }
    button,select,input{
      min-height:42px;
      border-radius:12px;
      border-color:var(--ui-border);
      background:var(--ui-panel);
    }
    button:hover,select:hover,input:hover{border-color:#bdc8d6}
    .top{
      position:sticky;
      top:0;
      z-index:30;
      background:rgba(248,250,252,.92);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(217,224,232,.85);
    }
    .topInner{
      max-width:1240px;
      margin:0 auto;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      padding:10px 20px;
    }
    .brand{
      width:max-content;
      padding:9px 12px;
      border:1px solid rgba(217,224,232,.9);
      border-radius:999px;
      background:rgba(255,255,255,.72);
      font-weight:700;
      flex-shrink:0;
    }
    .label{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:6px;
      flex:1;
      justify-content:flex-end;
    }
    .label .small{text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--ui-muted)}
    #prevDay,#nextDay{width:36px;padding:0;font-size:18px}
    #timeInput{border-color:var(--ui-border)!important;background:var(--ui-panel);width:110px!important}
    #daySelect{width:52px;padding:0 4px;text-align:center}
    #editProfile,#openCatalog,#toggleTheme{flex-shrink:0}

    .shell{max-width:1240px;margin:0 auto;padding:20px 20px 80px}
    .hero{
      grid-template-columns:minmax(260px,.55fr) minmax(0,1fr);
      align-items:stretch;
      gap:24px;
      padding:32px 0 24px;
    }
    .hero > div:first-child{
      align-items:flex-start;
      min-height:260px;
      padding:28px;
      border-radius:28px;
      background:
        linear-gradient(135deg,rgba(255,255,255,.10),transparent 36%),
        linear-gradient(135deg,#111827 0%,#1b365f 58%,#1769df 100%);
      position:relative;
      overflow:hidden;
    }
    .hero > div:first-child:before{
      content:"День";
      position:absolute;
      left:28px;
      bottom:28px;
      color:rgba(255,255,255,.72);
      font-size:14px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .hero > div:first-child:after{

      --ui-warm:#2e2510;
      --ui-shadow:0 1px 3px rgba(0,0,0,.32);
      --ui-shadow-soft:0 1px 2px rgba(0,0,0,.22);
    }
    [data-theme="dark"] html{background:var(--ui-bg)}
    [data-theme="dark"] body{background:var(--ui-bg);color:var(--ui-ink)}
    [data-theme="dark"] button,[data-theme="dark"] select,[data-theme="dark"] input{background:var(--ui-panel);color:var(--ui-ink);border-color:var(--ui-border)}
    [data-theme="dark"] button:hover,[data-theme="dark"] select:hover,[data-theme="dark"] input:hover{border-color:#4a5066}
    [data-theme="dark"] .top{background:rgba(15,17,23,.92);border-bottom-color:rgba(46,50,64,.85)}
    [data-theme="dark"] .brand{background:rgba(26,29,39,.72);border-color:rgba(46,50,64,.9)}
    [data-theme="dark"] #timeInput{background:var(--ui-panel)!important}
    [data-theme="dark"] .side > div,[data-theme="dark"] .line,[data-theme="dark"] details,[data-theme="dark"] .remaining,[data-theme="dark"] .nowCard,[data-theme="dark"] .mealCard,[data-theme="dark"] .action,[data-theme="dark"] .budgetTile,[data-theme="dark"] .miniBox,[data-theme="dark"] .boxRow,[data-theme="dark"] .recipeStats{background:var(--ui-panel);border-color:var(--ui-border)}
    [data-theme="dark"] .recipeStats span{border-color:var(--ui-border);color:var(--ui-muted)}
    [data-theme="dark"] .dayControls{background:rgba(15,17,23,.82);border-color:rgba(46,50,64,.82)}
    [data-theme="dark"] .dayControls button{background:var(--ui-panel);color:var(--ui-ink)}
    [data-theme="dark"] .dayControls .jumpBtn{background:var(--ui-ink);color:var(--ui-bg);border-color:var(--ui-ink)}
    [data-theme="dark"] .nowCard{border-color:rgba(74,158,255,.25)}
    [data-theme="dark"] .nowCard:before{background:linear-gradient(180deg,var(--ui-blue),var(--ui-green))}
    [data-theme="dark"] .nextAction{border-color:rgba(74,158,255,.4);background:rgba(74,158,255,.06)}
    [data-theme="dark"] .doneAction{background:rgba(46,189,127,.08);border-color:rgba(46,189,127,.25)}
    [data-theme="dark"] .skippedAction{background:rgba(204,126,28,.08);border-color:rgba(204,126,28,.25)}
    [data-theme="dark"] .snoozedAction{border-color:rgba(74,158,255,.45)}
    [data-theme="dark"] .statusPill{background:rgba(204,126,28,.12);color:#c4a24a;border-color:rgba(204,126,28,.25)}
    [data-theme="dark"] .pwaStatus{background:rgba(46,189,127,.1);border-color:rgba(46,189,127,.2);color:var(--ui-green)}
    [data-theme="dark"] .pwaStatus.offline{background:rgba(204,126,28,.1);border-color:rgba(204,126,28,.2);color:#c4a24a}
    [data-theme="dark"] .modal{background:var(--ui-panel);border-color:var(--ui-border)}
    [data-theme="dark"] .modalBackdrop{background:rgba(0,0,0,.55)}
    [data-theme="dark"] .inlineRecipe summary,[data-theme="dark"] .nowMore summary{background:var(--ui-panel);color:var(--ui-ink);border-color:var(--ui-border)}
    [data-theme="dark"] .shopSectionTitle{color:var(--ui-ink)}
    [data-theme="dark"] .catalogRow{background:var(--ui-panel);border-color:var(--ui-border)}
    [data-theme="dark"] .quickNav button{background:var(--ui-panel-soft);color:var(--ui-muted);border-color:var(--ui-border)}
    [data-theme="dark"] .quickNav button:hover{color:var(--ui-blue);border-color:var(--ui-blue)}
    [data-theme="dark"] #markDayDone,[data-theme="dark"] #markDone,[data-theme="dark"] .primaryAction,[data-theme="dark"] .actionBtns button,[data-theme="dark"] .nowCard button[data-dish],[data-theme="dark"] .nowCard button[data-cook],[data-theme="dark"] .nowCard button[data-basket],[data-theme="dark"] .mealCard button{background:var(--ui-blue);color:#fff;border-color:var(--ui-blue)}
    [data-theme="dark"] .onboarding{background:var(--ui-bg)}
    [data-theme="dark"] .onboardingCard{background:var(--ui-panel);border-color:var(--ui-border)}
    [data-theme="dark"] .onboardingOpts button{background:var(--ui-panel-soft);color:var(--ui-ink);border-color:var(--ui-border)}
    [data-theme="dark"] .onboardingOpts button.active{background:var(--ui-ink);color:var(--ui-bg);border-color:var(--ui-ink)}
    [data-theme="dark"] .onboardingStart{background:var(--ui-blue);color:#fff;border-color:var(--ui-blue)}
    [data-theme="dark"] .onboardingStatus{background:var(--ui-panel-soft);border-color:var(--ui-border)}
    [data-theme="dark"] .toggleBtn.active,[data-theme="dark"] .tabs button.active{background:var(--ui-ink);color:var(--ui-bg);border-color:var(--ui-ink)}
    [data-theme="dark"] #plus15,[data-theme="dark"] #plus30{color:var(--ui-blue);border-color:rgba(74,158,255,.28)}
    [data-theme="dark"] .replaceBtn{background:var(--ui-panel-soft);color:var(--ui-muted);border-color:var(--ui-border)}
    [data-theme="dark"] .dangerAction{background:rgba(204,126,28,.1);color:#c4a24a;border-color:rgba(204,126,28,.25)}
    [data-theme="dark"] .quietAction{background:var(--ui-panel-soft);color:var(--ui-muted);border-color:var(--ui-border)}
    [data-theme="dark"] .secondaryAction{background:var(--ui-panel)!important;color:var(--ui-ink)!important;border-color:var(--ui-border)!important}
    [data-theme="dark"] .catalogRow .primary{background:var(--ui-blue);color:#fff;border-color:var(--ui-blue)}
    [data-theme="dark"] .budgetTile.good strong{color:var(--ui-green)}

    /* ── Full HD (1920+) ── */
    @media(min-width:1400px){
      .shell{max-width:1380px;padding:28px 40px 80px}
      .topInner{max-width:1380px;padding:12px 40px}
      .nowCard{padding:34px 38px}
      .action{padding:18px 22px}
      .actionTitle{font-size:22px}
      .actionTime{font-size:34px}
      .sectionTitle h2{font-size:36px}
      .statusKcal{font-size:22px}
      .budgetTile strong{font-size:28px}
      .budgetTile{padding:20px}
    }

    @keyframes ffSpin{to{transform:rotate(360deg)}}
    @media(max-width:980px){
      .onboardingCard{padding:28px 20px}
      .onboardingOpts button{min-height:46px;font-size:16px;min-width:64px}
    }
  </style>
</head>
<body>
<a class="skipLink" href="#today">К расписанию</a>
<div id="loadingOverlay" style="position:fixed;inset:0;z-index:200;background:var(--ui-bg,#f4f6f8);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .3s ease">
  <div style="width:40px;height:40px;border:4px solid var(--ui-border,#d9e0e8);border-top-color:var(--ui-blue,#1769df);border-radius:50%;animation:ffSpin .8s linear infinite"></div>
  <div id="loadingMessage" style="color:var(--ui-muted,#66758a);font-size:14px;font-weight:700;text-align:center;max-width:280px">Загрузка…</div>
</div>
<header class="top">
  <div class="topInner">
    <div class="brand"><span class="icon" data-icon="grid"></span><span>FoodFlow</span></div>
    <div class="label">
      <button id="editProfile">Профиль</button>
      <button id="toggleTheme" title="Тёмная тема" aria-label="Переключить тему" style="font-size:16px;padding:6px 10px;min-height:30px;border-radius:999px">☀</button>
      <button id="openCatalog" title="Каталог рецептов">Каталог</button>
      <button id="regeneratePlan" title="Перегенерировать план" style="color:var(--ui-blue);font-size:12px;padding:6px 10px;min-height:30px;border-radius:999px">↻ Новый</button>
      <button id="storeModeBtn" class="storeModeBtn" title="Режим магазина" aria-label="Режим магазина">🛒</button>
      <button id="resetProgress" title="Сбросить прогресс" style="color:var(--ui-muted);font-size:12px;padding:6px 10px;min-height:30px;border-radius:999px">Сброс</button>
      <span id="pwaStatus" class="pwaStatus" aria-live="polite">Сеть</span>
      <span class="small">День</span>
      <select id="daySelect"></select>
      <button id="prevDay" aria-label="Предыдущий день">←</button>
      <button id="nextDay" aria-label="Следующий день">→</button>
      <span class="small">Время</span>
      <input id="timeInput" type="time" style="font:inherit;border:1px solid var(--ui-border,#d9e0e8);padding:8px 12px;width:130px">
    </div>
  </div>
</header>

<main class="shell">
  <div class="fridge" id="fridge"></div>
  <section id="today" class="section" aria-labelledby="pageTitle"></section>
  
</main>

<div class="modalBackdrop" id="modal">
  <div class="modal">
    <div class="modalHead">
      <div><h2 class="modalTitle" id="modalTitle">Блюдо</h2></div>
      <button id="closeModal">Закрыть</button>
    </div>
    <div class="modalMeta" id="modalMeta"></div>
    <div id="modalBody"></div>
  </div>
</div>

<script type="application/json" id="foodflow-agent-notes">
{
  "purpose": "Скрытые на странице рабочие правила для будущей доработки FoodFlow. Блок виден только в исходнике HTML.",
  "rules": [
    "Главная логика: покупки упаковками -> доступность по дням -> FIFO свежих продуктов -> списание сырья -> контейнеры -> остатки.",
    "Новое блюдо нельзя добавлять без рецепта в RECIPES и расхода в DISH_USAGE.",
    "Новый продукт нельзя добавлять без INVENTORY_ITEMS, INVENTORY_PURCHASES и срока годности в SHELF_LIFE_DAYS, если продукт свежий.",
    "Покупки должны покрываться PACKAGE_ORDERS; граммы в INVENTORY_PURCHASES не должны превышать сумму упаковок.",

    "UX-правило: главный экран - расписание по времени; бюджет, остатки, меню и настройки остаются раскрывающимися вторичными блоками.",
    "Бюджет default-плана держать в пределах выбранного профиля; для a1_c0 текущий лимит 20000 рублей.",
    "Активная готовка целится в 45 минут в день, белок не ниже 70 г на взрослый эквивалент."

<script src="app.js" defer></script>
</body>
</html>
